name: Keep Supabase alive

on:
  schedule:
    - cron: '0 10 */4 * *'  # cada 4 días a las 10:00 UTC
  workflow_dispatch:         # también se puede lanzar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping mompo.fit para mantener Supabase activo
        run: |
          curl -sf https://mompo.fit/api/ping || echo "Ping fallido, revisar"
